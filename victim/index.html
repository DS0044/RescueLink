<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESCUE LINK - Victim Emergency Terminal</title>
  <link rel="stylesheet" href="/css/victim.css">
  <link rel="stylesheet" href="/css/tower-sim.css">
  <script src="/js/tower-config.js" defer></script>
  <script src="/js/tower-sim.js" defer></script>
</head>
<body class="theme-dark">
  <div class="victim-page-wrapper">
    <div class="victim-form-card">
      <div class="victim-hero-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="badge-priority p2">ASTRA HACKATHON</span>
          <span class="badge-priority" style="background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid #10B981;">OFFLINE READY</span>
        </div>
        <h1 style="font-size: 26px; font-weight: 800; margin: 8px 0 4px; color: #FFFFFF;">Victim Emergency Terminal</h1>
        <p style="font-size: 13px; color: #94A3B8; margin: 0;">Transmits survival telemetry over low-power LoRa mesh directly to disaster rescue teams.</p>
      </div>

      <form id="victim-sos-form" class="card card-accent-top">
        <!-- 1. Emergency Condition -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-section-title" style="display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px;">
            <span>1. Emergency Condition</span>
          </label>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;">
            <button type="button" class="emergency-card-btn selected" data-type="2">
              <span class="emergency-card-name">Trapped in Flood</span>
              <span class="badge-priority p2">P2 Urgent</span>
            </button>
            <button type="button" class="emergency-card-btn" data-type="1">
              <span class="emergency-card-name">Heart Attack</span>
              <span class="badge-priority p1">P1 Critical</span>
            </button>
            <button type="button" class="emergency-card-btn" data-type="3">
              <span class="emergency-card-name">Injured / Trauma</span>
              <span class="badge-priority p2">P2 Urgent</span>
            </button>
          </div>
        </div>

        <!-- 2. People Needing Extraction -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-section-title" style="display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px;">
            <span>2. People Needing Extraction</span>
          </label>
          <div style="display: flex; align-items: center; gap: 12px;">
            <input type="number" id="input-people-count" value="1" min="1" max="99" style="width: 80px; padding: 8px 12px; background: #0F172A; border: 1px solid #24304D; border-radius: 6px; color: #FFFFFF; font-size: 16px; font-weight: 700;">
            <span style="font-size: 13px; color: #94A3B8;">People trapped with you</span>
          </div>
        </div>

        <!-- 3. GPS Coordinates -->
        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-section-title" style="display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px;">
            <span>3. Current Location Fix</span>
          </label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label for="input-latitude" style="display: block; font-size: 11px; text-transform: uppercase; color: #94A3B8; margin-bottom: 4px;">Latitude</label>
              <input type="number" step="0.0001" id="input-latitude" value="13.0827" style="width: 100%; padding: 8px 12px; background: #0F172A; border: 1px solid #24304D; border-radius: 6px; color: #FFFFFF; font-family: monospace;">
            </div>
            <div>
              <label for="input-longitude" style="display: block; font-size: 11px; text-transform: uppercase; color: #94A3B8; margin-bottom: 4px;">Longitude</label>
              <input type="number" step="0.0001" id="input-longitude" value="80.2707" style="width: 100%; padding: 8px 12px; background: #0F172A; border: 1px solid #24304D; border-radius: 6px; color: #FFFFFF; font-family: monospace;">
            </div>
          </div>
        </div>

        <!-- Action Button -->
        <div style="margin-top: 24px;">
          <button type="submit" class="btn-emergency-sos" style="width: 100%; padding: 14px; background: #FF6A1A; border: none; border-radius: 8px; color: #FFFFFF; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span>SEND EMERGENCY SOS NOW</span>
          </button>
          <p style="text-align: center; margin-top: 8px; font-size: 12px; color: #94A3B8;">Encodes into 21-byte binary packet. Broadcasts over simulated LoRa SX1276 channel.</p>
        </div>
      </form>
    </div>

    <!-- Nearest Radio Tower Simulation (Additive Visual Module) -->
    <section id="tower-sim-panel"></section>
  </div>
</body>
</html>
